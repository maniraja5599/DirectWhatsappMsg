<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply saved/OS theme before first paint to avoid a flash.
      try {
        var __t = localStorage.getItem('wa-direct:theme');
        document.documentElement.dataset.theme =
          __t === 'dark' || __t === 'light'
            ? __t
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Quickly open a WhatsApp chat for any mobile number, with optional message and reusable saved messages. Private, fast, mobile-first." />
    <meta name="theme-color" content="#047857" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b141a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FiFTO Direct" />
    <meta name="format-detection" content="telephone=no" />
    <title>FiFTO Direct App — Chat Without Saving Contacts</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p style="padding:24px;font-family:system-ui;text-align:center">
        FiFTO Direct App needs JavaScript to build WhatsApp links. Please enable JavaScript.
      </p>
    </noscript>
  </body>
</html>
